name: Wire order chat
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Patch App wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace("import { CustomerChatModal } from './components/CustomerChatModal';", "import { CustomerChatModal } from './components/CustomerChatModal';\nimport { OrderChatModal } from './components/OrderChatModal';")
          s=s.replace("  const [isSupportOpen, setIsSupportOpen] = useState(false);", "  const [isSupportOpen, setIsSupportOpen] = useState(false);\n  const [selectedChatOrder, setSelectedChatOrder] = useState<Order | null>(null);")
          old="  useEffect(() => { localStorage.setItem('altakhfid_wishlist', JSON.stringify(wishlistIds)); }, [wishlistIds]);"
          new=old+"\n\n  useEffect(() => {\n    const handler = (event: Event) => { const order = (event as CustomEvent<Order>).detail; if (order) setSelectedChatOrder(order); };\n    window.addEventListener('openOrderChat', handler);\n    return () => window.removeEventListener('openOrderChat', handler);\n  }, []);"
          s=s.replace(old,new)
          s=s.replace("<OrdersModal isOpen={isOrdersOpen} orders={orders} currency={currency} onClose={() => setIsOrdersOpen(false)} onOpenSupport={() => { setIsOrdersOpen(false); setIsSupportOpen(true); }}/>", "<OrdersModal isOpen={isOrdersOpen} orders={orders} currency={currency} onClose={() => setIsOrdersOpen(false)} onOpenSupport={() => { setIsOrdersOpen(false); setIsSupportOpen(true); }} onOpenOrderChat={(order) => setSelectedChatOrder(order)}/>")
          s=s.replace("      <CustomerChatModal isOpen={isSupportOpen} onClose={() => setIsSupportOpen(false)}/>", "      <CustomerChatModal isOpen={isSupportOpen} onClose={() => setIsSupportOpen(false)}/>\n      <OrderChatModal isOpen={!!selectedChatOrder} order={selectedChatOrder} user={user} onClose={() => setSelectedChatOrder(null)} onOrderChanged={(updated) => setOrders((current) => current.map((item) => item.id === updated.id ? { ...item, ...updated } : item))} onShowToast={showToast}/>")
          p.write_text(s)
          PY
      - name: Validate
        run: bun install && bun run typecheck && bun run build
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-order-chat.yml
          git add -A
          git commit -m "wire order chat into app" || true
          git push origin main
