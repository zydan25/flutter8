name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install frontend dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build frontend
        run: bun run build
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function dependencies
        working-directory: functions
        run: npm install
      - name: Typecheck functions
        working-directory: functions
        run: npm run typecheck
      - name: Build functions
        working-directory: functions
        run: npm run build
