name: Wire admin settings and self hosted auth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-settings-server.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Patch source files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('src/auth.ts')
          auth.write_text(r'''import { getFunctions, httpsCallable } from 'firebase/functions';
import { app } from './firebase';

const apiBaseUrl = String(import.meta.env.VITE_API_BASE_URL || '').replace(/\\/$/, '');
const functions = getFunctions(app, 'us-central1');

export interface SendOtpResponse { success: boolean; phoneNumber: string; expiresInSeconds: number; retryAfterSeconds: number; }
export interface VerifyOtpResponse {
  success: boolean;
  customToken: string;
  user: { uid: string; phone: string; firstName?: string; secondName?: string; thirdName?: string; lastName?: string; governorate?: string; role?: 'admin' | 'customer'; isAdmin?: boolean; createdAt?: string; lastLoginAt?: string; updatedAt?: string; };
}

async function requestServer<T>(path: string, body: unknown): Promise<T> {
  if (!apiBaseUrl) throw new Error('لم يتم ضبط رابط خادم المصادقة. أضف VITE_API_BASE_URL عند بناء التطبيق.');
  const response = await fetch(`${apiBaseUrl}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(String(payload.error || 'تعذر الاتصال بخادم المصادقة'));
  return payload as T;
}

export async function sendWhatsAppOtp(data: { phoneNumber: string }): Promise<{ data: SendOtpResponse }> {
  if (apiBaseUrl) return { data: await requestServer<SendOtpResponse>('/api/auth/send-otp', data) };
  const callable = httpsCallable<{ phoneNumber: string }, SendOtpResponse>(functions, 'sendWhatsAppOtp');
  return { data: (await callable(data)).data };
}

export async function verifyWhatsAppOtp(data: { phoneNumber: string; otp: string; firstName: string; secondName?: string; thirdName?: string; lastName?: string; governorate: string; }): Promise<{ data: VerifyOtpResponse }> {
  if (apiBaseUrl) return { data: await requestServer<VerifyOtpResponse>('/api/auth/verify-otp', data) };
  const callable = httpsCallable<typeof data, VerifyOtpResponse>(functions, 'verifyWhatsAppOtp');
  return { data: (await callable(data)).data };
}
''', encoding='utf-8')

