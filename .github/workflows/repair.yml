name: Professional Repair CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      REPAIR_COMMIT: "repair: professional auth firestore orders"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rewrite and harden source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('.')
          def write(path, text):
              p=root/path; p.parent.mkdir(parents=True, exist_ok=True); p.write_text(text, encoding='utf-8')
          old_fb=(root/'src/firebase.ts').read_text(encoding='utf-8')
          m=re.search(r"export const firebaseConfig\s*=\s*\{.*?\};", old_fb, re.S)
          if not m: raise SystemExit('firebaseConfig block not found')
          firebase_config=m.group(0)

          write('src/firebase.ts', f'''import {{ getApp, getApps, initializeApp }} from 'firebase/app';
          import {{ collection, deleteDoc, doc, getDoc, getDocs, getFirestore, onSnapshot, query, setDoc, updateDoc, where, writeBatch }} from 'firebase/firestore';
          import {{ getAuth }} from 'firebase/auth';
          import type {{ Unsubscribe }} from 'firebase/firestore';
          import type {{ Order, Product, User }} from './types';
          {firebase_config}
          export const FIRESTORE_DATABASE_ID='ai-studio-3cbe8e72-8545-44eb-90af-bac8612b6c5c';
          export const app=getApps().length?getApp():initializeApp(firebaseConfig); export const auth=getAuth(app); export const db=getFirestore(app,FIRESTORE_DATABASE_ID);
          const userFrom=(d:Record<string,unknown>,id:string):User=>({{...(d as User),uid:String(d.uid??id)}}); const orderFrom=(d:Record<string,unknown>,id:string):Order=>({{...(d as Order),id:String(d.id??id)}});
          export async function fetchUserProfile(uid:string):Promise<User|null>{{const s=await getDoc(doc(db,'users',uid));return s.exists()?userFrom(s.data(),s.id):null;}}
          export async function syncUserToFirestore(user:User):Promise<void>{{await setDoc(doc(db,'users',user.uid),{{...user,updatedAt:new Date().toISOString()}},{{merge:true}});}}
          export async function deleteUserFromFirestore(uid:string):Promise<void>{{await deleteDoc(doc(db,'users',uid));}}
          export function subscribeToOrdersForUser(uid:string,onChange:(o:Order[])=>void):Unsubscribe{{const q=query(collection(db,'orders'),where('customerId','==',uid));return onSnapshot(q,s=>onChange(s.docs.map(d=>orderFrom(d.data(),d.id)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))),e=>{{console.error(e);onChange([]);}});}}
          export function subscribeToAllOrders(onChange:(o:Order[])=>void):Unsubscribe{{return onSnapshot(collection(db,'orders'),s=>onChange(s.docs.map(d=>orderFrom(d.data(),d.id)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))),e=>{{console.error(e);onChange([]);}});}}
          export async function fetchAllOrdersFromFirestore():Promise<Order[]>{{const s=await getDocs(collection(db,'orders'));return s.docs.map(d=>orderFrom(d.data(),d.id));}}
          export async function fetchAllUsersFromFirestore():Promise<User[]>{{const s=await getDocs(collection(db,'users'));return s.docs.map(d=>userFrom(d.data(),d.id));}}
          export async function updateOrderStatusInFirestore(id:string,status:Order['status'],isPaid?:boolean):Promise<void>{{const p:Record<string,unknown>={{status,updatedAt:new Date().toISOString()}};if(typeof isPaid==='boolean')p.isPaid=isPaid;await updateDoc(doc(db,'orders',id),p);}}
          export function subscribeToProducts(onChange:(p:Product[])=>void):Unsubscribe{{return onSnapshot(collection(db,'products'),s=>onChange(s.docs.map(d=>({{...d.data(),id:d.id}} as Product))),e=>{{console.error(e);onChange([]);}});}}
          export async function saveProductToFirestore(p:Product):Promise<void>{{await setDoc(doc(db,'products',p.id),p,{{merge:true}});}}
          export async function deleteProductFromFirestore(id:string):Promise<void>{{await deleteDoc(doc(db,'products',id));}}
          export async function seedProductsToFirestore(ps:Product[]):Promise<void>{{const ex=await getDocs(collection(db,'products'));if(!ex.empty)return;for(let i=0;i<ps.length;i+=400){{const b=writeBatch(db);for(const p of ps.slice(i,i+400))b.set(doc(db,'products',p.id),p,{{merge:true}});await b.commit();}}}}
          ''')

          write('src/auth.ts','''import { getFunctions, httpsCallable } from 'firebase/functions';\nimport { app } from './firebase';\nconst functions=getFunctions(app,'us-central1');\nexport const sendWhatsAppOtp=httpsCallable<{phoneNumber:string},{success:boolean;phoneNumber:string;expiresInSeconds:number;retryAfterSeconds:number}>(functions,'sendWhatsAppOtp');\nexport const verifyWhatsAppOtp=httpsCallable<any,{success:boolean;customToken:string;user:any}>(functions,'verifyWhatsAppOtp');\n''')
          write('src/orderService.ts','''import { getFunctions, httpsCallable } from 'firebase/functions';\nimport { app } from './firebase';\nimport type { Order } from './types';\nconst functions=getFunctions(app,'us-central1');\nexport interface CreateOrderInput{customerName:string;governorate:string;address:string;currency:'YER'|'SAR';paymentMethod:Order['paymentMethod'];items:Array<{productId:string;quantity:number;color?:string;size?:string}>;}\nconst call=httpsCallable<CreateOrderInput,{success:boolean;order:Order}>(functions,'createOrder');\nexport async function createOrder(input:CreateOrderInput):Promise<Order>{return (await call(input)).data.order;}\n''')

          types=(root/'src/types.ts').read_text(encoding='utf-8'); types=types.replace('export interface Order {\n  id: string;', 'export interface Order {\n  id: string;\n  customerId: string;'); (root/'src/types.ts').write_text(types,encoding='utf-8')

          write('src/components/AuthModal.tsx','''import React,{useEffect,useState} from 'react';\nimport {X,User as UserIcon,Phone,MapPin,ShieldCheck,ArrowRight,LogOut,RefreshCw} from 'lucide-react';\nimport {signInWithCustomToken} from 'firebase/auth';\nimport type {User as UserType} from '../types';\nimport {ALL_GOVERNORATES} from '../data/governorates';\nimport {auth} from '../firebase';\nimport {sendWhatsAppOtp,verifyWhatsAppOtp} from '../auth';\ninterface Props{isOpen:boolean;user:UserType|null;onClose:()=>void;onLogin:(u:UserType)=>void;onLogout:()=>void;onShowToast:(m:string,t?:'success'|'info'|'error')=>void;}\nconst normalize=(v:string)=>{let d=v.replace(/\\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='967'+d.slice(1);if(d.length===9&&d.startsWith('7'))d='967'+d;return d;};\nexport const AuthModal:React.FC<Props>=({isOpen,user,onClose,onLogin,onLogout,onShowToast})=>{\n const[phone,setPhone]=useState(''),[otp,setOtp]=useState(''),[first,setFirst]=useState(''),[second,setSecond]=useState(''),[third,setThird]=useState(''),[last,setLast]=useState(''),[governorate,setGovernorate]=useState('أمانة العاصمة'),[step,setStep]=useState<'phone'|'otp'>('phone'),[busy,setBusy]=useState(false),[cooldown,setCooldown]=useState(0);\n useEffect(()=>{if(cooldown<=0)return;const id=window.setInterval(()=>setCooldown(v=>Math.max(0,v-1)),1000);return()=>window.clearInterval(id);},[cooldown]);\n if(!isOpen)return null;\n const requestOtp=async()=>{const p=normalize(phone);if(!/^\\d{8,15}$/.test(p)){onShowToast('رقم الهاتف غير صالح','error');return;}setBusy(true);try{const r=await sendWhatsAppOtp({phoneNumber:p});setPhone(p);setStep('otp');setCooldown(r.data.retryAfterSeconds||60);onShowToast('تم إرسال رمز التحقق عبر واتساب ✅','success');}catch(e:any){console.error(e);onShowToast(e?.message||'تعذر إرسال رمز التحقق','error');}finally{setBusy(false);}};\n const verify=async(e:React.FormEvent)=>{e.preventDefault();if(!/^\\d{6}$/.test(otp)||!first.trim()){onShowToast('أدخل رمز التحقق والاسم الأول','error');return;}setBusy(true);try{const r=await verifyWhatsAppOtp({phoneNumber:phone,otp,firstName:first.trim(),secondName:second.trim()||undefined,thirdName:third.trim()||undefined,lastName:last.trim()||undefined,governorate});await signInWithCustomToken(auth,r.data.customToken);onLogin(r.data.user as UserType);onClose();onShowToast(r.data.user.isAdmin?'تم تسجيل الدخول إلى الإدارة بنجاح 👑':`أهلاً بك يا ${r.data.user.firstName}!`,'success');}catch(e:any){console.error(e);onShowToast(e?.message||'رمز التحقق غير صحيح أو منتهي الصلاحية','error');}finally{setBusy(false);}};\n return <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={onClose}><div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between px-6 py-4 bg-purple-700 text-white"><div className="flex items-center gap-2"><UserIcon className="w-5 h-5"/><h3 className="font-extrabold">{user?'الملف الشخصي':'الدخول برقم الهاتف'}</h3></div><button onClick={onClose}><X className="w-5 h-5"/></button></div><div className="p-6">{user?<div className="space-y-4"><div className="flex items-center gap-3 bg-purple-50 p-4 rounded-2xl"><div className="w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center font-black">{user.firstName?.[0]||'ع'}</div><div><b>{user.firstName} {user.secondName||''} {user.lastName||''}</b><div className="text-xs text-slate-500 font-mono">{user.phone}</div>{user.isAdmin&&<div className="text-[10px] text-amber-800 flex items-center gap-1 mt-1"><ShieldCheck className="w-3 h-3"/>مدير المتجر</div>}</div></div><button onClick={onLogout} className="w-full py-2.5 rounded-xl border border-rose-200 text-rose-600 text-xs font-bold flex items-center justify-center gap-2"><LogOut className="w-4 h-4"/>تسجيل الخروج</button></div>:step==='phone'?<div className="space-y-3"><p className="text-xs text-slate-500">سيتم إرسال رمز من 6 أرقام إلى واتساب.</p><div className="relative"><Phone className="absolute right-3 top-3 w-4 h-4 text-slate-400"/><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="رقم الهاتف" className="w-full p-3 pr-9 rounded-xl border text-sm"/></div><button disabled={busy} onClick={requestOtp} className="w-full py-3 rounded-xl bg-purple-600 disabled:opacity-50 text-white font-bold text-sm">{busy?'جاري إرسال الرمز...':'إرسال رمز واتساب'} <ArrowRight className="inline w-4 h-4"/></button></div>:<form onSubmit={verify} className="space-y-3"><div className="text-xs text-slate-500">أدخل الرمز الذي وصل إلى {phone}</div><input inputMode="numeric" maxLength={6} value={otp} onChange={e=>setOtp(e.target.value.replace(/\\D/g,'').slice(0,6))} className="w-full text-center tracking-[0.4em] text-xl font-black p-3 rounded-xl border bg-purple-50" placeholder="000000"/><div className="grid grid-cols-2 gap-2"><input required value={first} onChange={e=>setFirst(e.target.value)} placeholder="الاسم الأول *" className="p-2.5 rounded-xl border text-xs"/><input value={second} onChange={e=>setSecond(e.target.value)} placeholder="اسم الأب" className="p-2.5 rounded-xl border text-xs"/></div><div className="grid grid-cols-2 gap-2"><input value={third} onChange={e=>setThird(e.target.value)} placeholder="اسم الجد" className="p-2.5 rounded-xl border text-xs"/><input value={last} onChange={e=>setLast(e.target.value)} placeholder="العائلة" className="p-2.5 rounded-xl border text-xs"/></div><div className="relative"><MapPin className="absolute right-3 top-3 w-4 h-4 text-slate-400"/><select value={governorate} onChange={e=>setGovernorate(e.target.value)} className="w-full p-2.5 pr-9 rounded-xl border text-xs">{ALL_GOVERNORATES.map(g=><option key={g} value={g}>{g}</option>)}</select></div><button disabled={busy} className="w-full py-3 rounded-xl bg-purple-600 disabled:opacity-50 text-white font-bold text-sm">{busy?'جاري التحقق...':'تحقق وتسجيل الدخول'}</button><button type="button" disabled={cooldown>0||busy} onClick={requestOtp} className="w-full py-2 rounded-xl border text-xs font-bold flex items-center justify-center gap-2"><RefreshCw className="w-3.5 h-3.5"/>{cooldown?`إعادة الإرسال بعد ${cooldown}ث`:'إعادة إرسال الرمز'}</button></form>}</div></div></div>;\n};\n''')

          p=root/'src/components/CartModal.tsx'; cart=p.read_text(encoding='utf-8'); cart=cart.replace("import { saveOrderToFirestore } from '../firebase';", "import { createOrder } from '../orderService';\nimport type { User as UserType } from '../types';"); cart=cart.replace("  cartItems: CartItem[];\n  currency", "  cartItems: CartItem[];\n  user: UserType | null;\n  currency"); cart=cart.replace("  cartItems,\n  currency", "  cartItems,\n  user,\n  currency"); cart=cart.replace("  if (!isOpen) return null;\n\n  const [customerName", "  const [customerName"); cart=cart.replace("  const [isSubmitting, setIsSubmitting] = useState(false);\n\n  const subtotal", "  const [isSubmitting, setIsSubmitting] = useState(false);\n\n  if (!isOpen) return null;\n\n  const subtotal");
          cart=cart.replace("    setIsSubmitting(true);\n    const orderId = `ord-${Date.now()}`;\n    const orderNumber = `TK-${Math.floor(100000 + Math.random() * 900000)}`;\n\n    const newOrder: Order = {", "    if (!user) { onShowToast('سجّل الدخول برقم الهاتف أولاً لإتمام الطلب', 'error'); return; }\n    setIsSubmitting(true);\n\n    const placeholder = true;\n")
          cart=cart.replace("    try {\n      await saveOrderToFirestore(newOrder);", "    try {\n      const newOrder = await createOrder({customerName: customerName.trim(),governorate,address: address.trim(),currency,paymentMethod,items: cartItems.map(item => ({productId:item.product.id,quantity:item.quantity,color:item.selectedColor,size:item.selectedSize}))});")
          cart=re.sub(r"\n      id: orderId,.*?\n    \};", "", cart, flags=re.S)
          cart=cart.replace("    const placeholder = true;\n", "")
          p.write_text(cart,encoding='utf-8')

          p=root/'src/components/ProductDetailsModal.tsx'; s=p.read_text(encoding='utf-8'); s=s.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';"); s=s.replace("  if (!product) return null;\n\n  const productPrice", "  const productPrice"); s=s.replace("  const productPrice = typeof product.price === 'number' ? product.price : (typeof product.discountPrice === 'number' ? product.discountPrice : (typeof product.originalPrice === 'number' ? product.originalPrice : 0));", "  const productPrice = product ? (typeof product.price === 'number' ? product.price : (typeof product.discountPrice === 'number' ? product.discountPrice : (typeof product.originalPrice === 'number' ? product.originalPrice : 0))) : 0;"); s=s.replace("  const productOriginalPrice = typeof product.originalPrice === 'number' ? product.originalPrice : productPrice;", "  const productOriginalPrice = product ? (typeof product.originalPrice === 'number' ? product.originalPrice : productPrice) : 0;"); s=s.replace("    product.colors && product.colors.length > 0 ? product.colors[0].name : undefined", "    product?.colors && product.colors.length > 0 ? product.colors[0].name : undefined"); s=s.replace("    product.sizes && product.sizes.length > 0 ? product.sizes[0] : undefined", "    product?.sizes && product.sizes.length > 0 ? product.sizes[0] : undefined"); s=s.replace("  const [quantity, setQuantity] = useState(1);\n\n  const getProductHashtag", "  const [quantity, setQuantity] = useState(1);\n  useEffect(() => { setSelectedColor(product?.colors?.[0]?.name); setSelectedSize(product?.sizes?.[0]); setQuantity(1); }, [product?.id]);\n\n  const getProductHashtag"); s=s.replace("  const trendTag = getProductHashtag(product);", "  const trendTag = product ? getProductHashtag(product) : '';\n\n  if (!product) return null;"); p.write_text(s,encoding='utf-8')

          p=root/'src/components/AdminModal.tsx'; s=p.read_text(encoding='utf-8'); s=s.replace("  if (!isOpen) return null;\n\n  const [activeTab", "  const [activeTab"); s=s.replace("\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4", "\n  if (!isOpen) return null;\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4"); p.write_text(s,encoding='utf-8')

          p=root/'src/App.tsx'; s=p.read_text(encoding='utf-8'); import_line="import type { Product, Category, Banner, TrendCampaign, CartItem, Order, User } from './types';"; s=s.replace(import_line,import_line+"\nimport { onAuthStateChanged, signOut } from 'firebase/auth';\nimport { auth, fetchUserProfile, subscribeToOrdersForUser, subscribeToAllOrders, subscribeToProducts, seedProductsToFirestore, saveProductToFirestore, deleteProductFromFirestore } from './firebase';") if "onAuthStateChanged" not in s else s; s=re.sub(r"  const \[user, setUser\] = useState<User \| null>\(\(\) => \{.*?  \}\);", "  const [user, setUser] = useState<User | null>(null);", s, count=1, flags=re.S); marker="  // Sync to LocalStorage\n"; block="""  useEffect(() => {\n    let active=true; const unsubscribe=onAuthStateChanged(auth,async firebaseUser=>{if(!active)return;if(!firebaseUser){setUser(null);return;}try{const profile=await fetchUserProfile(firebaseUser.uid);if(!active)return;setUser(profile||{uid:firebaseUser.uid,phone:(firebaseUser.phoneNumber||'').replace(/^\\+/,''),role:'customer',isAdmin:false});}catch(e){console.error('Failed to load signed-in profile',e);}}); return()=>{active=false;unsubscribe();};\n  }, []);\n  useEffect(() => { if(!user?.uid){setOrders([]);return;} return user.isAdmin?subscribeToAllOrders(setOrders):subscribeToOrdersForUser(user.uid,setOrders); }, [user?.uid,user?.isAdmin]);\n  useEffect(() => { let seeded=false; return subscribeToProducts(items=>{if(items.length){setProducts(items);return;}if(user?.isAdmin&&!seeded){seeded=true;seedProductsToFirestore(INITIAL_PRODUCTS).catch(e=>console.error('Initial product seed failed',e));}}); }, [user?.isAdmin]);\n\n"""; s=s.replace(marker,block+marker) if "fetchUserProfile(firebaseUser.uid)" not in s else s; s=s.replace("        cartItems={cartItems}\n        currency={currency}","        cartItems={cartItems}\n        user={user}\n        currency={currency}"); s=s.replace("          setProducts((prev) => [prod, ...prev]);\n          showToast('تمت إضافة المنتج بنجاح', 'success');", "          setProducts((prev) => [prod, ...prev.filter((p) => p.id !== prod.id)]);\n          saveProductToFirestore(prod).then(() => showToast('تم حفظ المنتج ✅','success')).catch(e => { console.error(e); showToast('فشل حفظ المنتج','error'); });"); s=s.replace("          setProducts((prev) => prev.filter((p) => p.id !== prodId));\n          showToast('تم حذف المنتج بنجاح', 'info');", "          setProducts((prev) => prev.filter((p) => p.id !== prodId));\n          deleteProductFromFirestore(prodId).then(() => showToast('تم حذف المنتج ✅','success')).catch(e => { console.error(e); showToast('فشل حذف المنتج','error'); });"); s=s.replace("        onLogin={setUser}\n        onLogout={() => setUser(null)}","        onLogin={setUser}\n        onLogout={async () => { await signOut(auth); setUser(null); }}"); p.write_text(s,encoding='utf-8')

          write('index.html','''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#000000"/><title>التخفيض الصح</title><link rel="manifest" href="%BASE_URL%manifest.json"/><link rel="icon" href="%BASE_URL%icon.svg"/><link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com"/><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/></head><body class="bg-slate-100 font-['Cairo',sans-serif]"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>''')
          write('vite.config.ts','''import {defineConfig} from 'vite';\nimport react from '@vitejs/plugin-react';\nimport tailwindcss from '@tailwindcss/vite';\nexport default defineConfig({base:process.env.GITHUB_ACTIONS?'/flutter8/':'/',plugins:[react(),tailwindcss()],server:{port:3000,host:'0.0.0.0',strictPort:true,allowedHosts:true},preview:{port:3000,host:'0.0.0.0',strictPort:true,allowedHosts:true}});\n''')
          pkg=__import__('json').loads((root/'package.json').read_text(encoding='utf-8')); pkg['version']='1.1.0'; pkg['scripts']['typecheck']='tsc --noEmit'; pkg['scripts']['lint']='tsc --noEmit'; (root/'package.json').write_text(__import__('json').dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          write('tsconfig.json','''{"compilerOptions":{"target":"ES2020","useDefineForClassFields":true,"lib":["ES2020","DOM","DOM.Iterable"],"skipLibCheck":true,"esModuleInterop":true,"allowSyntheticDefaultImports":true,"strict":true,"forceConsistentCasingInFileNames":true,"module":"ESNext","moduleResolution":"Bundler","resolveJsonModule":true,"isolatedModules":true,"noEmit":true,"jsx":"react-jsx"},"include":["src"]}\n''')
          write('firestore.rules','''rules_version='2';\nservice cloud.firestore {\n match /databases/{database}/documents {\n  function signedIn(){return request.auth!=null;} function isAdmin(){return signedIn()&&request.auth.token.admin==true;} function owner(uid){return signedIn()&&request.auth.uid==uid;}\n  match /products/{id}{allow read:if true;allow write:if isAdmin();}\n  match /categories/{id}{allow read:if true;allow write:if isAdmin();}\n  match /banners/{id}{allow read:if true;allow write:if isAdmin();}\n  match /campaigns/{id}{allow read:if true;allow write:if isAdmin();}\n  match /users/{uid}{allow read:if isAdmin()||owner(uid);allow write:if isAdmin();}\n  match /orders/{id}{allow create:if signedIn()&&request.resource.data.customerId==request.auth.uid;allow read:if isAdmin()||(signedIn()&&resource.data.customerId==request.auth.uid);allow update,delete:if isAdmin();}\n  match /chats/{chatId}{allow read,write:if isAdmin()||(signedIn()&&resource.data.customerId==request.auth.uid);match /messages/{messageId}{allow read,write:if isAdmin()||(signedIn()&&get(/databases/$(database)/documents/chats/$(chatId)).data.customerId==request.auth.uid);}}\n  match /admin_roles/{uid}{allow read:if isAdmin()||owner(uid);allow write:if isAdmin();}\n  match /deleted_users/{uid}{allow read,write:if isAdmin();}\n  match /otp_requests/{id}{allow read,write:if false;} match /test/{id}{allow read,write:if false;}\n }\n}\n''')
          write('firebase.json','''{"functions":{"source":"functions"},"firestore":{"rules":"firestore.rules"}}\n'''); write('.firebaserc','''{"projects":{"default":"valued-leaf-npthm"}}\n''')
          write('functions/package.json','''{"name":"takhfid-functions","private":true,"engines":{"node":"20"},"main":"lib/index.js","scripts":{"build":"tsc","lint":"tsc --noEmit"},"dependencies":{"firebase-admin":"^14.3.0","firebase-functions":"^7.0.0"},"devDependencies":{"@types/node":"^22.0.0","typescript":"^5.7.2"}}\n''')
          write('functions/tsconfig.json','''{"compilerOptions":{"module":"NodeNext","moduleResolution":"NodeNext","target":"ES2022","outDir":"lib","strict":true,"esModuleInterop":true,"skipLibCheck":true},"include":["src"]}\n''')
          write('functions/src/index.ts','''import {createHash,randomInt} from 'node:crypto';\nimport {initializeApp} from 'firebase-admin/app'; import {getAuth} from 'firebase-admin/auth'; import {FieldValue,getFirestore} from 'firebase-admin/firestore';\nimport {defineSecret} from 'firebase-functions/params'; import {setGlobalOptions} from 'firebase-functions/v2'; import {HttpsError,onCall} from 'firebase-functions/v2/https'; import * as logger from 'firebase-functions/logger';\ninitializeApp(); setGlobalOptions({region:'us-central1',maxInstances:10}); const db=getFirestore('ai-studio-3cbe8e72-8545-44eb-90af-bac8612b6c5c'); const auth=getAuth();\nconst WHATSAPP_SEND_URL=defineSecret('WHATSAPP_SEND_URL'); const OTP_HASH_SECRET=defineSecret('OTP_HASH_SECRET'); const ADMIN_PHONES=defineSecret('ADMIN_PHONES');\nconst normalize=(v:string)=>{let d=String(v||'').replace(/\\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='967'+d.slice(1);if(d.length===9&&d.startsWith('7'))d='967'+d;return d;}; const hash=(p:string,o:string,s:string)=>createHash('sha256').update(`${p}:${o}:${s}`).digest('hex');\nexport const sendWhatsAppOtp=onCall({secrets:[WHATSAPP_SEND_URL,OTP_HASH_SECRET]},async req=>{const phone=normalize(req.data?.phoneNumber);if(!/^\\d{8,15}$/.test(phone))throw new HttpsError('invalid-argument','رقم الهاتف غير صالح');const ref=db.collection('otp_requests').doc(createHash('sha256').update(phone).digest('hex').slice(0,32));const old=await ref.get();const now=Date.now();if(old.exists&&now-Number(old.data()?.sentAtMs||0)<60000)throw new HttpsError('resource-exhausted','انتظر قبل إعادة الإرسال');const otp=String(randomInt(100000,1000000));await ref.set({phone,hash:hash(phone,otp,OTP_HASH_SECRET.value()),sentAtMs:now,expiresAtMs:now+300000,attempts:0});const form=new FormData();form.append('phoneNumber',phone);form.append('message',`رمز الدخول إلى التخفيض الصح: ${otp}\\nصالح لمدة 5 دقائق. لا تشاركه مع أي شخص.`);try{const r=await fetch(WHATSAPP_SEND_URL.value(),{method:'POST',body:form});if(!r.ok){await ref.delete();logger.error('WhatsApp OTP failed',{status:r.status});throw new HttpsError('unavailable','تعذر إرسال رمز التحقق عبر واتساب');}}catch(e){await ref.delete().catch(()=>undefined);if(e instanceof HttpsError)throw e;throw new HttpsError('unavailable','خدمة واتساب غير متاحة حاليًا');}return{success:true,phoneNumber:phone,expiresInSeconds:300,retryAfterSeconds:60};});\nexport const verifyWhatsAppOtp=onCall({secrets:[OTP_HASH_SECRET,ADMIN_PHONES]},async req=>{const phone=normalize(req.data?.phoneNumber),otp=String(req.data?.otp||'');if(!/^\\d{8,15}$/.test(phone)||!/^\\d{6}$/.test(otp))throw new HttpsError('invalid-argument','بيانات التحقق غير صالحة');const ref=db.collection('otp_requests').doc(createHash('sha256').update(phone).digest('hex').slice(0,32));const snap=await ref.get();if(!snap.exists)throw new HttpsError('failed-precondition','لا يوجد رمز تحقق نشط');const rec=snap.data()!;if(Date.now()>Number(rec.expiresAtMs||0)){await ref.delete();throw new HttpsError('deadline-exceeded','انتهت صلاحية الرمز');}if(Number(rec.attempts||0)>=5){await ref.delete();throw new HttpsError('resource-exhausted','تم تجاوز عدد المحاولات');}if(hash(phone,otp,OTP_HASH_SECRET.value())!==rec.hash){await ref.update({attempts:FieldValue.increment(1)});throw new HttpsError('permission-denied','رمز التحقق غير صحيح');}const uid=`usr_${phone}`,admins=ADMIN_PHONES.value().split(',').map(normalize).filter(Boolean),isAdmin=admins.includes(phone),nowIso=new Date().toISOString();try{try{await auth.getUser(uid);}catch(e:any){if(e?.code==='auth/user-not-found')await auth.createUser({uid,phoneNumber:`+${phone}`});else throw e;}await auth.setCustomUserClaims(uid,{admin:isAdmin,role:isAdmin?'admin':'customer'});const refUser=db.collection('users').doc(uid),old=(await refUser.get()).data()||{};const user={uid,phone,firstName:String(req.data?.firstName||old.firstName||''),secondName:String(req.data?.secondName||old.secondName||''),thirdName:String(req.data?.thirdName||old.thirdName||''),lastName:String(req.data?.lastName||old.lastName||''),governorate:String(req.data?.governorate||old.governorate||'أمانة العاصمة'),role:isAdmin?'admin':'customer',isAdmin,createdAt:String(old.createdAt||nowIso),lastLoginAt:nowIso,updatedAt:nowIso};await refUser.set(user,{merge:true});const customToken=await auth.createCustomToken(uid,{admin:isAdmin,role:user.role});await ref.delete();return{success:true,customToken,user};}catch(e){logger.error('OTP finalization failed',e);throw new HttpsError('internal','تعذر إكمال تسجيل الدخول');}});\nexport const createOrder=onCall(async req=>{if(!req.auth?.uid)throw new HttpsError('unauthenticated','يجب تسجيل الدخول قبل إنشاء الطلب');const items=Array.isArray(req.data?.items)?req.data.items:[];if(!items.length||items.length>100)throw new HttpsError('invalid-argument','السلة غير صالحة');const snaps=await Promise.all(items.map((i:any)=>db.collection('products').doc(String(i.productId)).get()));const orderItems=items.map((i:any,n:number)=>{const s=snaps[n];if(!s.exists)throw new HttpsError('not-found','أحد المنتجات غير موجود');const p=s.data()||{},q=Math.max(1,Math.min(99,Number(i.quantity)||1));return{productId:s.id,productName:String(p.name||'منتج'),quantity:q,price:Number(p.price||p.discountPrice||p.originalPrice||0),image:String(p.image||''),color:i.color?String(i.color):undefined,size:i.size?String(i.size):undefined};});const profile=(await db.collection('users').doc(req.auth.uid).get()).data()||{},subtotal=orderItems.reduce((sum,i)=>sum+i.price*i.quantity,0),currency=req.data?.currency==='SAR'?'SAR':'YER',shippingFee=currency==='SAR'?18:2500,orderRef=db.collection('orders').doc(),order={id:orderRef.id,customerId:req.auth.uid,orderNumber:`TK-${randomInt(100000,1000000)}`,customerName:String(req.data?.customerName||profile.firstName||'عميل').trim(),customerPhone:String(profile.phone||''),governorate:String(req.data?.governorate||profile.governorate||'أمانة العاصمة'),address:String(req.data?.address||'').trim(),items:orderItems,subtotal,shippingFee,discount:0,total:subtotal+shippingFee,currency,status:'preparing',paymentMethod:['cash_on_delivery','kuraimi','jawali','one_cash'].includes(req.data?.paymentMethod)?req.data.paymentMethod:'cash_on_delivery',createdAt:new Date().toISOString(),isPaid:false};await orderRef.set(order);return{success:true,order};});\n''')
          write('functions/.gitignore','node_modules/\nlib/\n.env\n')
          # Remove stale built files that were being served instead of Vite output.
