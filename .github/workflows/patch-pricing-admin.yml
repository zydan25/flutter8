name: Add Pricing Admin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-pricing-admin.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing management
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path('src/types.ts')
