          if 'export interface GovernoratePricing' not in s:
              s += "\nexport interface GovernoratePricing { governorate: string; region: 'north' | 'south'; sarToYerRate: number; usdToYerRate: number; markupType: 'percentage' | 'fixed'; markupValue: number; deliveryFeeYer: number; deliveryFeeSar: number; freeDeliveryIncluded: boolean; deliveryNote?: string; isActive?: boolean; updatedAt?: string; }\n"
          p.write_text(s)
          
          Path('src/pricingSettingsService.ts').write_text(r'''import { collection, getDocs, onSnapshot, setDoc, doc } from 'firebase/firestore';
import { db } from './firebase';
import { GOVERNORATE_RATES, ALL_GOVERNORATES } from './data/governorates';
import type { GovernoratePricing } from './types';

export const PRICING_COLLECTION = 'pricing_settings';

export function getDefaultPricing(governorate: string): GovernoratePricing {
  const fallback = GOVERNORATE_RATES[governorate] || GOVERNORATE_RATES['أمانة العاصمة'];
  return {
    governorate,
    region: fallback.region === 'south' ? 'south' : 'north',
    sarToYerRate: Number(fallback.sarToYerRate || 140),
    usdToYerRate: Number(fallback.usdToYerRate || 535),
    markupType: fallback.markupType === 'fixed' ? 'fixed' : 'percentage',
    markupValue: Number(fallback.markupValue || 0),
    deliveryFeeYer: fallback.freeDeliveryIncluded ? 0 : Number(fallback.deliveryFeeYer || 0),
    deliveryFeeSar: Number(fallback.deliveryFeeSar || 0),
    freeDeliveryIncluded: Boolean(fallback.freeDeliveryIncluded),
    deliveryNote: fallback.deliveryNote || '',
    isActive: fallback.isActive !== false,
  };
}

export async function fetchPricingSettings(): Promise<Record<string, GovernoratePricing>> {
  const snapshot = await getDocs(collection(db, PRICING_COLLECTION));
  const result: Record<string, GovernoratePricing> = {};
  ALL_GOVERNORATES.forEach((g) => { result[g] = getDefaultPricing(g); });
  snapshot.docs.forEach((d) => { result[d.id] = { ...getDefaultPricing(d.id), ...(d.data() as Partial<GovernoratePricing>), governorate: d.id } as GovernoratePricing; });
  return result;
}

export function subscribeToPricingSettings(onChange: (settings: Record<string, GovernoratePricing>) => void) {
  return onSnapshot(collection(db, PRICING_COLLECTION), (snapshot) => {
    const result: Record<string, GovernoratePricing> = {};
    ALL_GOVERNORATES.forEach((g) => { result[g] = getDefaultPricing(g); });
    snapshot.docs.forEach((d) => { result[d.id] = { ...getDefaultPricing(d.id), ...(d.data() as Partial<GovernoratePricing>), governorate: d.id } as GovernoratePricing; });
    onChange(result);
  }, (error) => { console.error('Pricing subscription failed:', error); fetchPricingSettings().then(onChange).catch(console.error); });
}

export async function savePricingSetting(setting: GovernoratePricing): Promise<void> {
  await setDoc(doc(db, PRICING_COLLECTION, setting.governorate), { ...setting, updatedAt: new Date().toISOString() }, { merge: true });
}
''')
          
