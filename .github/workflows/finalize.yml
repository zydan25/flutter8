name: Finalize Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run repair transformation and final corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          old = Path('.github/workflows/repair.yml')
          if not old.exists(): raise SystemExit('repair workflow not found')
          workflow = old.read_text(encoding='utf-8')
          start = workflow.index("python3 <<'PY'\n") + len("python3 <<'PY'\n")
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'repair.py', 'exec'), {})

          p=Path('src/types.ts'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(  customerId: string;\n){2,}', '  customerId: string;\n', s)
          if 'themeColor?: string;' not in s:
              s=s.replace('export interface Banner {\n', 'export interface Banner {\n  themeColor?: string;\n')
          p.write_text(s,encoding='utf-8')

          p=Path('src/firebase.ts'); s=p.read_text(encoding='utf-8')
          s=s.replace('as User', 'as unknown as User').replace('as Order', 'as unknown as Order').replace('const p:Record<string,unknown>', 'const p:Record<string,any>')
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/CartModal.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace('برقم ${orderNumber}', 'برقم ${newOrder.orderNumber}')
          p.write_text(s,encoding='utf-8')

          # Disable the source-mutating workflow after this validated one-shot pass.
          old.unlink()
          Path('.github/workflows/finalize.yml').unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build web
        run: bun run build
      - name: Build Firebase Functions
        working-directory: functions
        run: npm install && npm run build
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: finalize application and validation" || true
          git push origin main